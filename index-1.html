<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
<style>
  :root {
    --ink: #101A3A;
    --ink-2: #18254F;
    --gold: #FFB627;
    --gold-light: #FFD97A;
    --gold-deep: #C9820A;
    --mist: #8FA3D6;
    --paper: #F5F7FF;
    --line: rgba(143, 163, 214, 0.22);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: "Tajawal", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---------- الشريط العلوي: اسم الحساب + اللغة ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 20px; }
  .user { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    flex: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    display: grid; place-items: center;
    font-family: "Reem Kufi", "Tajawal", sans-serif;
    font-weight: 700; font-size: 1.15rem;
  }
  .user-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lang {
    flex: none;
    background: none;
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
    font-family: "Tajawal", sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- الرصيد ---------- */
  .balance { text-align: center; padding: 14px 20px 4px; }
  .balance-label { color: var(--mist); font-size: 1rem; margin: 0 0 2px; }
  .balance-row {
    direction: ltr;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
    font-family: "Reem Kufi", "Tajawal", sans-serif;
  }
  .balance-num { font-size: clamp(2.8rem, 13vw, 4rem); font-weight: 700; line-height: 1; }
  .balance-unit { font-size: 1.4rem; font-weight: 500; color: var(--gold); }

  /* ---------- الصفحات ---------- */
  .views {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 20px 20px;
  }
  .view { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  .view.home { align-items: center; justify-content: center; gap: 20px; }
  .view.gate { align-items: center; justify-content: center; text-align: center; gap: 14px; }
  .view h2 { font-family: "Reem Kufi", "Tajawal", sans-serif; font-size: 1.5rem; margin: 8px 0 4px; }
  .hint { color: var(--mist); margin: 0 0 12px; line-height: 1.7; }

  /* ---------- العملة ---------- */
  .stage { position: relative; width: min(74vw, 300px); aspect-ratio: 1; }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .track { stroke: var(--line); }
  .ring .fill { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }

  .coin, .gate-coin {
    border-radius: 50%;
    color: var(--ink);
    font-family: "Reem Kufi", "Tajawal", sans-serif;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-deep));
    box-shadow: inset 0 0 0 6px rgba(16, 26, 58, 0.16), inset 0 0 0 7px rgba(255, 255, 255, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .coin {
    position: absolute;
    inset: 9%;
    border: 0;
    cursor: pointer;
    transition: transform 0.08s ease-out, filter 0.2s;
  }
  .coin:active:not(:disabled) { transform: scale(0.96); }
  .coin:disabled { cursor: default; filter: saturate(0.55) brightness(0.8); }
  .coin-name { font-size: clamp(2.2rem, 11vw, 3.2rem); font-weight: 700; letter-spacing: 2px; line-height: 1; }
  .coin-status { font-family: "Tajawal", sans-serif; font-size: 1.05rem; font-weight: 700; direction: ltr; }
  .gate-coin { width: 120px; height: 120px; font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }

  .gain {
    position: absolute;
    left: 50%;
    top: 36%;
    translate: -50% 0;
    font-family: "Reem Kufi", sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--paper);
    direction: ltr;
    pointer-events: none;
    animation: rise 0.9s ease-out forwards;
  }
  @keyframes rise {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-90px); }
  }
  .note { color: var(--mist); font-size: 0.95rem; text-align: center; margin: 0; }

  /* ---------- أزرار ---------- */
  .btn {
    background: var(--gold);
    color: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 10px 20px;
    font-family: "Tajawal", sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:disabled { background: var(--line); color: var(--mist); cursor: default; }
  .btn.wide { width: 100%; padding: 14px 20px; font-size: 1.1rem; }
  .btn.ghost { background: none; color: var(--paper); border: 1px solid var(--line); }

  /* ---------- المهام ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-weight: 700; margin: 0 0 2px; }
  .row-reward { color: var(--gold); font-family: "Reem Kufi", sans-serif; margin: 0; }
  .row-reward span { display: inline-block; direction: ltr; unicode-bidi: isolate; }
  .done { color: var(--mist); font-weight: 700; }

  /* ---------- الحقول ---------- */
  .link-box {
    direction: ltr;
    width: 100%;
    padding: 12px 14px;
    margin: 4px 0 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--ink-2);
    color: var(--paper);
    font-size: 0.95rem;
    user-select: text;
    text-overflow: ellipsis;
  }

  /* ---------- السحب ---------- */
  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 8px 0 10px; }
  .bar-fill { height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width 0.3s; }
  .withdraw-info { color: var(--mist); margin: 0 0 18px; }
  .withdraw-info bdi { color: var(--paper); font-weight: 700; }
  .wallet-sec { margin-top: 32px; }

  /* ---------- شريط التبويبات ---------- */
  .tabbar {
    display: flex;
    background: var(--ink-2);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .tabbar[hidden] { display: none; }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: 0;
    color: var(--mist);
    font-family: "Tajawal", sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 6px 0;
    cursor: pointer;
  }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { color: var(--gold); font-weight: 700; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    translate: -50% 0;
    background: var(--paper);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .coin:focus-visible, .btn:focus-visible, .tab:focus-visible, .lang:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .gain { animation: none; opacity: 0; }
    .ring .fill, .coin, .bar-fill, .toast { transition: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="user">
    <span class="avatar" id="avatar">?</span>
    <bdi class="user-name" id="userName"></bdi>
  </div>
  <button class="lang" id="langBtn" type="button"></button>
</div>

<header class="balance" id="balanceBox" hidden>
  <p class="balance-label" data-i18n="balance">Balance</p>
  <div class="balance-row">
    <span class="balance-num" id="balance">0</span>
    <span class="balance-unit">LOE</span>
  </div>
</header>

<div class="views">

  <!-- ربط المحفظة (يظهر قبل البدء) -->
  <section class="view gate" data-view="gate" hidden>
    <div class="gate-coin" aria-hidden="true">LOE</div>
    <h2 data-i18n="gate_title">Connect your TON wallet</h2>
    <p class="hint" id="gateText" data-i18n="gate_text">Connect a TON wallet to start mining LOE.</p>
    <button class="btn wide" id="connectBtn" type="button" data-i18n="gate_btn">Connect wallet</button>
  </section>

  <!-- الرئيسية -->
  <section class="view home" data-view="home" hidden>
    <div class="stage" id="stage">
      <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="112"></circle>
        <circle class="fill" id="ring" cx="120" cy="120" r="112"></circle>
      </svg>
      <button class="coin" id="coin" type="button" aria-label="Mine LOE">
        <span class="coin-name">LOE</span>
        <span class="coin-status" id="status"></span>
      </button>
    </div>
    <p class="note" id="note"></p>
  </section>

  <!-- المهام -->
  <section class="view" data-view="tasks" hidden>
    <h2 data-i18n="tasks_title">Tasks</h2>
    <p class="hint" data-i18n="tasks_hint">Complete tasks to earn extra LOE.</p>
    <ul class="list" id="taskList"></ul>
  </section>

  <!-- إضافة (دعوة الأصدقاء) -->
  <section class="view" data-view="add" hidden>
    <h2 data-i18n="add_title">Invite friends</h2>
    <p class="hint" id="inviteHint"></p>
    <input class="link-box" id="inviteLink" type="text" readonly>
    <button class="btn wide" id="copyBtn" type="button" data-i18n="copy_btn">Copy invite link</button>
  </section>

  <!-- السحب -->
  <section class="view" data-view="withdraw" hidden>
    <h2 data-i18n="withdraw_title">Withdraw</h2>
    <p class="hint" id="withdrawHint"></p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="bar-fill" id="barFill"></div></div>
    <p class="withdraw-info" id="withdrawInfo"></p>
    <button class="btn wide" id="withdrawBtn" type="button" disabled data-i18n="request_btn">Request withdrawal</button>

    <div class="wallet-sec">
      <p class="hint" data-i18n="wallet_label">Connected TON wallet</p>
      <input class="link-box" id="walletBox" type="text" readonly>
      <button class="btn wide ghost" id="disconnectBtn" type="button" data-i18n="disconnect_btn">Disconnect wallet</button>
    </div>
  </section>

</div>

<nav class="tabbar" id="tabbar" aria-label="Navigation" hidden>
  <button class="tab active" type="button" data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
    <span data-i18n="tab_home">Home</span>
  </button>
  <button class="tab" type="button" data-view="tasks">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>
    <span data-i18n="tab_tasks">Tasks</span>
  </button>
  <button class="tab" type="button" data-view="add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M19 8v6M16 11h6"/></svg>
    <span data-i18n="tab_add">Add</span>
  </button>
  <button class="tab" type="button" data-view="withdraw">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg>
    <span data-i18n="tab_withdraw">Withdraw</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ================= الإعدادات: غيّر هذه القيم بسهولة =================
  const REWARD = 5;             // مكافأة الضغط على الدائرة (بسيطة)
  const COOLDOWN = 8 * 3600;    // الانتظار بالثواني = 8 ساعات (للتجربة السريعة اجعله 10 مؤقتاً)
  const TASK_WAIT = 5;          // ثواني الانتظار قبل ظهور زر "استلام" في المهمة
  const INVITE_REWARD = 25;     // مكافأة كل صديق (تُفعَّل مع السيرفر لاحقاً)
  const MIN_WITHDRAW = 1000;    // الحد الأدنى للسحب

  // رابط ملف المانيفست (يجب أن يكون على نفس موقعك وبـ HTTPS)
  const MANIFEST_URL = "https://loe26.github.io/IOE_Earning26/tonconnect-manifest.json";
  // رابط البوت بعد إنشائه من BotFather (سنضبطه في الخطوة التالية)
  const INVITE_BASE = "https://t.me/YOUR_BOT_NAME/app?startapp=";
  const TWA_RETURN_URL = "https://t.me/YOUR_BOT_NAME/app";

  // للمعاينة على اللابتوب فقط: true يتجاوز ربط المحفظة. أعده false قبل النشر!
  const SKIP_WALLET_FOR_TESTING = false;

  const STORAGE_KEY = "loe_state_v1";
  const LANG_KEY = "loe_lang";

  // قائمة المهام: أضف مهمة جديدة بإضافة سطر هنا
  const TASKS = [
    { id: "channel", title: { en: "Join the LOE channel",   ar: "انضم إلى قناة LOE" },     reward: 50, url: "https://t.me/YOUR_CHANNEL" },
    { id: "x",       title: { en: "Follow us on X",         ar: "تابعنا على إكس" },        reward: 30, url: "https://x.com/YOUR_ACCOUNT" },
    { id: "youtube", title: { en: "Subscribe on YouTube",   ar: "اشترك في قناة يوتيوب" },  reward: 40, url: "https://youtube.com/@YOUR_CHANNEL" }
  ];

  // ================= النصوص (الإنجليزية افتراضية) =================
  const STR = {
    en: {
      balance: "Balance",
      tab_home: "Home", tab_tasks: "Tasks", tab_add: "Add", tab_withdraw: "Withdraw",
      tap_to_mine: "Tap to mine",
      note: "Every {0} you get {1} LOE",
      tasks_title: "Tasks", tasks_hint: "Complete tasks to earn extra LOE.",
      start: "Start", claim: "Claim", done: "Done",
      add_title: "Invite friends", add_hint: "Earn {0} LOE for each friend who joins with your link.",
      copy_btn: "Copy invite link", copied: "Link copied",
      withdraw_title: "Withdraw", withdraw_hint: "Minimum withdrawal is {0} LOE.",
      request_btn: "Request withdrawal", withdraw_soon: "Withdrawals will be enabled in a later step",
      wallet_label: "Connected TON wallet", disconnect_btn: "Disconnect wallet",
      gate_title: "Connect your TON wallet", gate_text: "Connect a TON wallet to start mining LOE.",
      gate_btn: "Connect wallet",
      gate_error: "Wallet connection is unavailable. Check your internet connection and reload.",
      guest: "Guest", mine_label: "Mine LOE"
    },
    ar: {
      balance: "رصيدك",
      tab_home: "الرئيسية", tab_tasks: "المهام", tab_add: "إضافة", tab_withdraw: "السحب",
      tap_to_mine: "اضغط للتعدين",
      note: "كل {0} تحصل على {1} LOE",
      tasks_title: "المهام", tasks_hint: "أكمل المهام لتحصل على LOE إضافية.",
      start: "ابدأ", claim: "استلام", done: "تم",
      add_title: "إضافة الأصدقاء", add_hint: "عن كل صديق ينضم عبر رابطك تحصل على {0} LOE.",
      copy_btn: "نسخ رابط الدعوة", copied: "تم نسخ الرابط",
      withdraw_title: "السحب", withdraw_hint: "الحد الأدنى للسحب {0} LOE.",
      request_btn: "طلب سحب", withdraw_soon: "سيتم تفعيل السحب في خطوة لاحقة",
      wallet_label: "محفظة TON المربوطة", disconnect_btn: "فصل المحفظة",
      gate_title: "اربط محفظة TON", gate_text: "اربط محفظة TON لتبدأ بتعدين LOE.",
      gate_btn: "ربط المحفظة",
      gate_error: "تعذّر تحميل ربط المحفظة. تأكد من الإنترنت وأعد تحميل الصفحة.",
      guest: "زائر", mine_label: "تعدين LOE"
    }
  };
  // =====================================================================

  function loadLang() {
    try { var l = localStorage.getItem(LANG_KEY); if (l === "ar" || l === "en") return l; } catch (e) {}
    return "en";
  }
  var lang = loadLang();

  function t(key) {
    var s = (STR[lang] && STR[lang][key]) || STR.en[key] || key;
    for (var i = 1; i < arguments.length; i++) s = s.replace("{" + (i - 1) + "}", arguments[i]);
    return s;
  }

  // ---- تلجرام ----
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const userId = tgUser ? tgUser.id : "test";

  // ---- الحالة ----
  function loadState() {
    var s = { balance: 0, lastMine: 0, tasks: {} };
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && typeof saved.balance === "number") {
        s.balance = saved.balance;
        s.lastMine = saved.lastMine || 0;
        s.tasks = saved.tasks || {};
      }
    } catch (e) {}
    return s;
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  const state = loadState();

  // ---- عناصر ----
  const $ = function (id) { return document.getElementById(id); };
  const balanceEl = $("balance"), coinEl = $("coin"), statusEl = $("status"), ringEl = $("ring");
  const stageEl = $("stage"), noteEl = $("note"), toastEl = $("toast");
  const balanceBox = $("balanceBox"), tabbar = $("tabbar");

  function fmt(n) { return n.toLocaleString("en-US"); }

  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }
  function haptic(kind) { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || "light"); }

  // ---- المدة حسب اللغة ----
  function durationText(sec) {
    var n, u;
    if (sec >= 3600) { n = sec / 3600; u = "h"; }
    else if (sec >= 60) { n = sec / 60; u = "m"; }
    else { n = sec; u = "s"; }
    if (lang === "ar") {
      var ar = { h: ["ساعة", "ساعتان", "ساعات", "ساعة"], m: ["دقيقة", "دقيقتان", "دقائق", "دقيقة"], s: ["ثانية", "ثانيتان", "ثوانٍ", "ثانية"] }[u];
      if (n === 1) return ar[0];
      if (n === 2) return ar[1];
      return n + " " + (n <= 10 ? ar[2] : ar[3]);
    }
    var en = { h: "hour", m: "minute", s: "second" }[u];
    return n === 1 ? en : n + " " + en + "s";
  }
  function formatTime(total) {
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    var p = function (x) { return String(x).padStart(2, "0"); };
    return p(h) + ":" + p(m) + ":" + p(s);
  }

  // ================= اسم الحساب =================
  function renderUser() {
    var name = "";
    if (tgUser) {
      name = tgUser.username ? "@" + tgUser.username
        : ((tgUser.first_name || "") + (tgUser.last_name ? " " + tgUser.last_name : "")).trim();
    }
    if (!name) name = t("guest");
    $("userName").textContent = name;
    var src = tgUser ? (tgUser.first_name || tgUser.username || "") : "";
    $("avatar").textContent = src ? src.charAt(0).toUpperCase() : "?";
  }

  // ================= محفظة TON =================
  var tonConnectUI = null;
  try {
    if (window.TON_CONNECT_UI) {
      var opts = { manifestUrl: MANIFEST_URL, uiPreferences: { theme: "DARK" } };
      if (TWA_RETURN_URL.indexOf("YOUR_") === -1) opts.actionsConfiguration = { twaReturnUrl: TWA_RETURN_URL };
      tonConnectUI = new TON_CONNECT_UI.TonConnectUI(opts);
    }
  } catch (e) { tonConnectUI = null; }

  var walletReady = false;

  function walletConnected() {
    return SKIP_WALLET_FOR_TESTING || !!(tonConnectUI && tonConnectUI.account);
  }
  function getAddress() {
    if (!tonConnectUI || !tonConnectUI.account) return SKIP_WALLET_FOR_TESTING ? "TEST-WALLET" : "";
    var raw = tonConnectUI.account.address;
    try {
      if (TON_CONNECT_UI.toUserFriendlyAddress) {
        return TON_CONNECT_UI.toUserFriendlyAddress(raw, tonConnectUI.account.chain === "-3");
      }
    } catch (e) {}
    return raw;
  }
  function onWalletChange() { walletReady = true; $("walletBox").value = getAddress(); applyGate(); }

  $("connectBtn").addEventListener("click", function () {
    if (tonConnectUI) tonConnectUI.openModal();
  });
  $("disconnectBtn").addEventListener("click", function () {
    if (tonConnectUI) tonConnectUI.disconnect();
  });

  if (tonConnectUI) {
    tonConnectUI.onStatusChange(onWalletChange);
    tonConnectUI.connectionRestored.then(onWalletChange, onWalletChange);
    setTimeout(function () { if (!walletReady) onWalletChange(); }, 5000); // احتياط إن تأخّر الاسترجاع
  } else {
    walletReady = true;
    $("connectBtn").disabled = true;
  }

  // ================= التبويبات + بوابة المحفظة =================
  const tabs = document.querySelectorAll(".tab");
  const views = document.querySelectorAll(".view");
  var currentTab = "home";

  function showView(name) {
    views.forEach(function (v) { v.hidden = v.dataset.view !== name; });
    tabs.forEach(function (tab) {
      var on = tab.dataset.view === name;
      tab.classList.toggle("active", on);
      if (on) tab.setAttribute("aria-current", "page"); else tab.removeAttribute("aria-current");
    });
  }
  function applyGate() {
    if (!walletReady) { balanceBox.hidden = true; tabbar.hidden = true; showView(null); return; }
    if (walletConnected()) { balanceBox.hidden = false; tabbar.hidden = false; showView(currentTab); }
    else { balanceBox.hidden = true; tabbar.hidden = true; showView("gate"); }
  }
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () { currentTab = tab.dataset.view; showView(currentTab); haptic("light"); });
  });

  // ================= الرئيسية =================
  const CIRCUMFERENCE = 2 * Math.PI * 112;
  ringEl.style.strokeDasharray = CIRCUMFERENCE;

  function showGain() {
    var el = document.createElement("span");
    el.className = "gain";
    el.textContent = "+" + REWARD;
    el.addEventListener("animationend", function () { el.remove(); });
    stageEl.appendChild(el);
  }
  function mine() {
    if ((Date.now() - state.lastMine) / 1000 < COOLDOWN) return;
    state.balance += REWARD;
    state.lastMine = Date.now();
    saveState();
    showGain();
    haptic("light");
    render();
  }
  coinEl.addEventListener("click", mine);

  // ================= المهام =================
  function openLink(url) {
    if (tg && /^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank", "noopener");
  }

  const taskRefs = {};
  const listEl = $("taskList");
  TASKS.forEach(function (task) {
    var li = document.createElement("li"); li.className = "row";
    var text = document.createElement("div"); text.className = "row-text";
    var title = document.createElement("p"); title.className = "row-title";
    var reward = document.createElement("p"); reward.className = "row-reward";
    var rv = document.createElement("span"); rv.textContent = "+" + task.reward + " LOE"; reward.appendChild(rv);
    text.appendChild(title); text.appendChild(reward);
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "btn";
    var done = document.createElement("span"); done.className = "done"; done.hidden = true;
    btn.addEventListener("click", function () { onTask(task); });
    li.appendChild(text); li.appendChild(btn); li.appendChild(done);
    listEl.appendChild(li);
    taskRefs[task.id] = { title: title, btn: btn, done: done };
  });

  function onTask(task) {
    var st = state.tasks[task.id];
    if (st && st.done) return;
    if (!st) {
      state.tasks[task.id] = { startedAt: Date.now(), done: false };
      saveState();
      openLink(task.url);
    } else if ((Date.now() - st.startedAt) / 1000 >= TASK_WAIT) {
      st.done = true;
      state.balance += task.reward;
      saveState();
      toast("+" + task.reward + " LOE");
      haptic("medium");
    }
    render();
  }

  function renderTasks() {
    TASKS.forEach(function (task) {
      var ref = taskRefs[task.id], st = state.tasks[task.id];
      ref.title.textContent = task.title[lang];
      ref.done.textContent = t("done");
      if (st && st.done) { ref.btn.hidden = true; ref.done.hidden = false; }
      else if (st) {
        ref.btn.hidden = false; ref.done.hidden = true;
        ref.btn.textContent = t("claim");
        ref.btn.disabled = (Date.now() - st.startedAt) / 1000 < TASK_WAIT;
      } else {
        ref.btn.hidden = false; ref.done.hidden = true;
        ref.btn.textContent = t("start");
        ref.btn.disabled = false;
      }
    });
  }

  // ================= إضافة (دعوة الأصدقاء) =================
  const inviteUrl = INVITE_BASE + userId;
  $("inviteLink").value = inviteUrl;
  $("copyBtn").addEventListener("click", function () {
    var box = $("inviteLink");
    var ok = function () { toast(t("copied")); };
    var fallback = function () { box.select(); try { document.execCommand("copy"); } catch (e) {} ok(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inviteUrl).then(ok, fallback);
    else fallback();
  });

  // ================= السحب =================
  $("withdrawBtn").addEventListener("click", function () { toast(t("withdraw_soon")); });
  function renderWithdraw() {
    var pct = Math.min(100, (state.balance / MIN_WITHDRAW) * 100);
    $("barFill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(pct));
    var info = $("withdrawInfo");
    info.textContent = "";
    var b = document.createElement("bdi");
    b.textContent = fmt(Math.min(state.balance, MIN_WITHDRAW)) + " / " + fmt(MIN_WITHDRAW) + " LOE";
    info.appendChild(b);
    $("withdrawBtn").disabled = state.balance < MIN_WITHDRAW;
  }

  // ================= اللغة =================
  function applyLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    if (!tonConnectUI) $("gateText").textContent = t("gate_error");
    $("langBtn").textContent = l === "en" ? "العربية" : "English";
    coinEl.setAttribute("aria-label", t("mine_label"));
    noteEl.textContent = t("note", durationText(COOLDOWN), REWARD);
    $("inviteHint").textContent = t("add_hint", INVITE_REWARD);
    $("withdrawHint").textContent = t("withdraw_hint", fmt(MIN_WITHDRAW));
    renderUser();
    render();
  }
  $("langBtn").addEventListener("click", function () { applyLang(lang === "en" ? "ar" : "en"); });

  // ================= الرسم الدوري =================
  function render() {
    var elapsed = (Date.now() - state.lastMine) / 1000;
    var left = Math.max(0, Math.ceil(COOLDOWN - elapsed));
    var progress = Math.min(1, elapsed / COOLDOWN);

    balanceEl.textContent = fmt(state.balance);
    ringEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
    if (left > 0) { coinEl.disabled = true; statusEl.textContent = formatTime(left); }
    else { coinEl.disabled = false; statusEl.textContent = t("tap_to_mine"); }

    renderTasks();
    renderWithdraw();
  }

  setInterval(render, 250);
  applyLang(lang);
  applyGate();
</script>
</body>
</html>
